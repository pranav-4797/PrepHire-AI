services:
  - type: web
    name: prephire-ai-upload-server
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_SHARED_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT
        sync: false
      # Online Coding Platform — sandboxed execution service. Defaults to the
      # public Piston demo instance in code if unset, but that instance is
      # rate-limited and NOT intended for production traffic. Self-host
      # Piston (https://github.com/engineer-man/piston, one Docker command)
      # and set this to your own instance before going live with real users.
      - key: PISTON_API_URL
        sync: false
